name: Bug report
description: Report something that isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check that it isn't [already reported](https://github.com/Fluffyalien1422/bedrock-energistics/issues?q=is%3Aissue), and that you're on a Minecraft version and a Bedrock Energistics Core version that the release you're using supports (each [release](https://github.com/Fluffyalien1422/bedrock-energistics/releases) notes both).

        **Not sure a machine is misbehaving?** The Bedrock Energistics Guide Book explains what each machine needs and produces. Hold it and interact with a machine to open that machine's entry.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The steps to make it happen again. If you can, try them in a fresh creative world with only this add-on and Bedrock Energistics Core, and say whether it still happens there.
      placeholder: |
        1. Place ...
        2. ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - A machine
        - Conduits or networks
        - A machine screen
        - A recipe or crafting
        - The guide book
        - The config file
        - Not sure
    validations:
      required: true

  - type: input
    id: be-version
    attributes:
      label: Bedrock Energistics version
      placeholder: "v0.14.0"
    validations:
      required: true

  - type: input
    id: bec-version
    attributes:
      label: Bedrock Energistics Core version
      description: The version of the Bedrock Energistics Core add-on in your world.
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.40"
    validations:
      required: true

  - type: textarea
    id: other-addons
    attributes:
      label: Other add-ons in the world
      description: Anything else applied to the world, especially other add-ons that use Bedrock Energistics Core, since machines from different add-ons share networks. Write "none" if there aren't any.
    validations:
      required: true

  - type: dropdown
    id: world-type
    attributes:
      label: Where are you playing?
      options:
        - A single-player world
        - A multiplayer world (LAN, or joining a friend)
        - A Realm
        - A dedicated or third-party server
        - Not sure

  - type: textarea
    id: config
    attributes:
      label: Changes to the config
      description: If you edited `scripts/__config.js` in the behavior pack, paste it here. Leave this empty if you didn't.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Content log output
      description: |
        Errors and warnings are written to the content log, which you can turn on under Settings > Creator. Reproduce the problem and paste anything that shows up.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, a video, a world download, what device you play on, or anything else that helps.
